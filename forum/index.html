<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="USC Minecraft community forums." />
    <title>Forum — USC Minecraft</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Pixelify+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="logo" href="/" aria-label="USC Minecraft home">
        <span class="logo-cube" aria-hidden="true"></span>
        <span class="logo-text">USC</span>
      </a>
      <nav class="topnav" aria-label="Page">
        <a href="/">Home</a>
        <a href="/forum/" aria-current="page">Forum</a>
        <a href="/data-policy.html">Data</a>
        <a href="/privacy-policy.html">Privacy</a>
      </nav>
      <div id="auth-slot" class="auth-slot"></div>
    </header>

    <main class="forum-page">
      <div class="forum-hero band band-dark">
        <div class="band-inner">
          <h1 class="band-title">Forum</h1>
          <p class="band-lede">
            Categories for the USC Minecraft community. Sign in with Google to
            post.
          </p>
        </div>
      </div>
      <div class="band-inner forum-body">
        <div id="forum-status" class="forum-status" role="status"></div>
        <ul id="category-list" class="forum-category-list"></ul>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <span class="footer-brand">USC Minecraft</span>
        <p class="footer-disclaimer">
          Not affiliated with the University of San Carlos, Mojang Studios, or
          Microsoft.
        </p>
      </div>
    </footer>

    <script type="module" src="/src/forum/pages/index.js"></script>
  </body>
</html>
