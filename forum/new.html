<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New thread — USC Minecraft Forum</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Pixelify+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="logo" href="/" aria-label="USC Minecraft home">
        <span class="logo-cube" aria-hidden="true"></span>
        <span class="logo-text">USC</span>
      </a>
      <nav class="topnav" aria-label="Page">
        <a href="/">Home</a>
        <a href="/forum/" aria-current="page">Forum</a>
        <a href="/data-policy.html">Data</a>
        <a href="/privacy-policy.html">Privacy</a>
      </nav>
      <div id="auth-slot" class="auth-slot"></div>
    </header>

    <main class="forum-page">
      <div class="band band-dark">
        <div class="band-inner">
          <p class="forum-crumb"><a href="/forum/">Forum</a></p>
          <h1 class="band-title">New thread</h1>
        </div>
      </div>
      <div class="band-inner forum-body">
        <div id="forum-status" class="forum-status" role="status"></div>
        <form id="new-thread-form" class="forum-compose panel">
          <label class="forum-label">
            Category
            <select id="thread-category" name="categorySlug" required></select>
          </label>
          <label class="forum-label">
            Title
            <input
              id="thread-title-input"
              name="title"
              type="text"
              maxlength="120"
              minlength="3"
              required
            />
          </label>
          <label class="forum-label">
            Body
            <textarea
              id="thread-body"
              name="body"
              rows="8"
              maxlength="10000"
              required
            ></textarea>
          </label>
          <button type="submit" class="btn btn-green">Create thread</button>
        </form>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <span class="footer-brand">USC Minecraft</span>
      </div>
    </footer>

    <script type="module" src="/src/forum/pages/new.js"></script>
  </body>
</html>
