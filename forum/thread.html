<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thread — USC Minecraft Forum</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Pixelify+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="logo" href="/" aria-label="USC Minecraft home">
        <img class="logo-mark" src="/logo.png" width="40" height="40" alt="" />
        <span class="logo-text">USC</span>
      </a>
      <nav class="topnav" aria-label="Page">
        <a href="/">Home</a>
        <a href="/forum/" aria-current="page">Forum</a>
      </nav>
      <div id="auth-slot" class="auth-slot"></div>
    </header>

    <main class="forum-page">
      <div class="band band-dark">
        <div class="band-inner">
          <p class="forum-crumb">
            <a href="/forum/">Forum</a>
            <span aria-hidden="true"> · </span>
            <a id="crumb-cat" href="#">Category</a>
          </p>
          <h1 id="thread-title" class="band-title">Thread</h1>
          <div class="thread-head-row">
            <div class="thread-vote comment-vote" id="thread-vote">
              <button type="button" class="vote-btn vote-up" data-vote="1" data-type="thread" aria-pressed="false" aria-label="Upvote thread">▲</button>
              <span class="vote-score">0</span>
              <button type="button" class="vote-btn vote-down" data-vote="-1" data-type="thread" aria-pressed="false" aria-label="Downvote thread">▼</button>
            </div>
            <p id="thread-meta" class="forum-meta"></p>
          </div>
        </div>
      </div>
      <div class="band-inner forum-body">
        <div id="forum-status" class="forum-status" role="status"></div>
        <div class="forum-thread-toolbar">
          <div class="forum-sort" role="tablist" aria-label="Sort comments">
            <button type="button" class="forum-sort-btn is-active" role="tab" aria-selected="true" data-sort="top">Top</button>
            <button type="button" class="forum-sort-btn" role="tab" aria-selected="false" data-sort="new">New</button>
            <button type="button" class="forum-sort-btn" role="tab" aria-selected="false" data-sort="controversial">Controversial</button>
          </div>
        </div>
        <ol id="comment-tree" class="comment-tree"></ol>

        <section id="reply-section" class="forum-compose panel" hidden>
          <h2>Add a comment</h2>
          <form id="reply-form">
            <label class="forum-label">
              <span class="sr-only">Your reply</span>
              <textarea
                id="reply-body"
                name="body"
                rows="5"
                maxlength="10000"
                required
                placeholder="Write a reply…"
              ></textarea>
            </label>
            <button type="submit" class="btn btn-green">Post reply</button>
          </form>
        </section>
        <p id="reply-gate" class="forum-gate" hidden></p>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <span class="footer-brand">USC Minecraft</span>
      </div>
    </footer>

    <script type="module" src="/src/forum/pages/thread.js"></script>
  </body>
</html>
