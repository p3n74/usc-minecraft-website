<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Member — USC Minecraft Forum</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Pixelify+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="logo" href="/" aria-label="USC Minecraft home">
        <img class="logo-mark" src="/logo.png" width="40" height="40" alt="" />
        <span class="logo-text">USC</span>
      </a>
      <nav class="topnav" aria-label="Page">
        <a href="/">Home</a>
        <a href="/forum/" aria-current="page">Forum</a>
      </nav>
      <div id="auth-slot" class="auth-slot"></div>
    </header>

    <main class="forum-page">
      <div class="band band-dark">
        <div class="band-inner">
          <p class="forum-crumb"><a href="/forum/">Forum</a></p>
          <h1 id="user-title" class="band-title">Member</h1>
        </div>
      </div>
      <div class="band-inner forum-body">
        <div id="forum-status" class="forum-status" role="status"></div>
        <article id="user-card" class="profile-preview panel" hidden>
          <div class="profile-banner" id="user-banner"></div>
          <div class="profile-preview-row">
            <img class="profile-avatar mc-face" id="user-avatar" width="80" height="80" alt="">
            <div>
              <p class="profile-preview-name" id="user-display"></p>
              <p class="profile-preview-handle forum-muted" id="user-username"></p>
            </div>
          </div>
          <div class="forum-user-card" style="padding: 1rem 1.2rem 1.2rem">
            <p id="user-mc-row" hidden>
              <strong>Minecraft:</strong> <span id="user-mc"></span>
            </p>
            <p id="user-email-row" hidden>
              <strong>Email:</strong> <span id="user-email"></span>
            </p>
          </div>
        </article>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <span class="footer-brand">USC Minecraft</span>
      </div>
    </footer>

    <script type="module" src="/src/forum/pages/user.js"></script>
  </body>
</html>
